<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Koshi Developer Portfolio</title>
  <desc id="description">Building practical web products across languages and borders.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#333"/>
      <stop offset="0.48" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#080808"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <text x="72" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="7">KOSHI</text>
  <text x="72" y="198" fill="#bbb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="5">DEVELOPER / ENGINEER</text>
  <text x="72" y="278" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">
    <tspan x="72" dy="0">Building practical web products</tspan>
    <tspan x="72" dy="68">across languages and borders.</tspan>
  </text>
  <text x="72" y="454" fill="#ccc" font-family="Inter,Arial,sans-serif" font-size="23">
    <tspan x="72">Multilingual web development for Japan, Taiwan,</tspan>
    <tspan x="72" dy="36">and communities across Asia.</tspan>
  </text>
  <line x1="72" y1="565" x2="1128" y2="565" stroke="#777"/>
  <text x="1128" y="598" text-anchor="end" fill="#aaa" font-family="Inter,Arial,sans-serif" font-size="18">koshijpn.github.io</text>
</svg>
